<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem;
        }

        .container {
            max-width: 600px;
            width: 100%;
        }

        .welcome-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 3rem;
            text-align: center;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.3);
            animation: fadeIn 0.6s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .success-icon {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 2rem;
            position: relative;
        }

        .success-icon.login {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .success-icon.register {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
        }

        .success-icon svg {
            width: 45px;
            height: 45px;
            fill: white;
        }

        .success-icon::after {
            content: '';
            position: absolute;
            inset: -4px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.2);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.1); opacity: 0.5; }
        }

        .badge {
            display: inline-block;
            padding: 0.4rem 1rem;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 1rem;
        }

        .badge.login {
            background: rgba(102, 126, 234, 0.2);
            color: #a8b8ff;
            border: 1px solid rgba(102, 126, 234, 0.3);
        }

        .badge.register {
            background: rgba(56, 239, 125, 0.2);
            color: #7dffb3;
            border: 1px solid rgba(56, 239, 125, 0.3);
        }

        h1 {
            color: #fff;
            font-size: 2rem;
            margin-bottom: 0.5rem;
            font-weight: 700;
        }

        .subtitle {
            color: rgba(255, 255, 255, 0.6);
            font-size: 1rem;
            margin-bottom: 2.5rem;
        }

        .user-info {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 1.5rem;
            margin-bottom: 2rem;
        }

        .user-info h3 {
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 1rem;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.75rem 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .info-row:last-child {
            border-bottom: none;
        }

        .info-label {
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.9rem;
        }

        .info-value {
            color: #fff;
            font-weight: 500;
            font-size: 0.95rem;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 1.25rem;
            text-align: center;
        }

        .stat-value {
            color: #fff;
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 0.25rem;
        }

        .stat-label {
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .actions {
            display: flex;
            gap: 1rem;
        }

        .btn {
            flex: 1;
            padding: 0.9rem 1.5rem;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            transition: all 0.3s ease;
            cursor: pointer;
            border: none;
            text-align: center;
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .btn-danger {
            background: rgba(220, 53, 69, 0.2);
            color: #ff6b7a;
            border: 1px solid rgba(220, 53, 69, 0.3);
        }

        .btn-danger:hover {
            background: rgba(220, 53, 69, 0.3);
        }

        .loading {
            text-align: center;
            color: rgba(255, 255, 255, 0.6);
        }

        .loading .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top-color: #667eea;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 1rem;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="loading" class="welcome-card">
            <div class="loading">
                <div class="spinner"></div>
                <p>Loading your dashboard...</p>
            </div>
        </div>

        <div id="dashboard" class="welcome-card" style="display: none;">
            <div id="successIcon" class="success-icon">
                <svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41L9 16.17z"/></svg>
            </div>

            <div id="badge" class="badge"></div>

            <h1 id="welcomeText">Welcome!</h1>
            <p class="subtitle" id="subtitle"></p>

            <div class="user-info">
                <h3>Your Account</h3>
                <div class="info-row">
                    <span class="info-label">Username</span>
                    <span class="info-value" id="username">--</span>
                </div>
                <div class="info-row">
                    <span class="info-label">Email</span>
                    <span class="info-value" id="email">--</span>
                </div>
                <div class="info-row">
                    <span class="info-label">Member since</span>
                    <span class="info-value" id="registeredAt">--</span>
                </div>
            </div>

            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-value" id="totalUsers">--</div>
                    <div class="stat-label">Total Users</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="serverTime">--</div>
                    <div class="stat-label">Server Time</div>
                </div>
            </div>

            <div class="actions">
                <a href="/" class="btn btn-secondary">Back to Login</a>
                <button onclick="logout()" class="btn btn-danger">Logout</button>
            </div>
        </div>
    </div>

    <script>
        function getActionFromUrl() {
            const params = new URLSearchParams(window.location.search);
            return params.get('action');
        }

        function formatDate(dateStr) {
            const date = new Date(dateStr);
            return date.toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
        }

        function formatTime(dateStr) {
            const date = new Date(dateStr);
            return date.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
        }

        async function loadDashboard() {
            const token = localStorage.getItem('token');
            if (!token) {
                window.location.href = '/';
                return;
            }

            try {
                const response = await fetch('/api/dashboard', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (!response.ok) {
                    localStorage.removeItem('token');
                    window.location.href = '/';
                    return;
                }

                const data = await response.json();
                const action = getActionFromUrl();

                document.getElementById('loading').style.display = 'none';
                document.getElementById('dashboard').style.display = 'block';

                const icon = document.getElementById('successIcon');
                const badge = document.getElementById('badge');

                if (action === 'register') {
                    icon.classList.add('register');
                    badge.classList.add('register');
                    badge.textContent = 'Account Created';
                    document.getElementById('welcomeText').textContent = 'Welcome aboard!';
                    document.getElementById('subtitle').textContent = 'Your account has been successfully created. Explore your dashboard.';
                } else {
                    icon.classList.add('login');
                    badge.classList.add('login');
                    badge.textContent = 'Welcome Back';
                    document.getElementById('welcomeText').textContent = `Hello, ${data.user.username}!`;
                    document.getElementById('subtitle').textContent = 'You have successfully logged in. Here is your dashboard.';
                }

                document.getElementById('username').textContent = data.user.username;
                document.getElementById('email').textContent = data.user.email;
                document.getElementById('registeredAt').textContent = formatDate(data.user.registeredAt);
                document.getElementById('totalUsers').textContent = data.stats.totalUsers;
                document.getElementById('serverTime').textContent = formatTime(data.serverTime);
            } catch (err) {
                localStorage.removeItem('token');
                window.location.href = '/';
            }
        }

        function logout() {
            localStorage.removeItem('token');
            window.location.href = '/';
        }

        loadDashboard();
    </script>
</body>
</html>
