<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            background: white;
            padding: 3rem;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            text-align: center;
            max-width: 500px;
            width: 90%;
        }
        .icon {
            width: 80px;
            height: 80px;
            background: #28a745;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.5rem;
        }
        .icon svg {
            width: 40px;
            height: 40px;
            fill: white;
        }
        h1 {
            color: #333;
            margin-bottom: 1rem;
            font-size: 1.8rem;
        }
        p {
            color: #666;
            margin-bottom: 1.5rem;
            line-height: 1.6;
        }
        .status {
            background: #f8f9fa;
            padding: 1.5rem;
            border-radius: 8px;
            margin-bottom: 1.5rem;
        }
        .status-item {
            display: flex;
            justify-content: space-between;
            padding: 0.5rem 0;
            border-bottom: 1px solid #eee;
        }
        .status-item:last-child {
            border-bottom: none;
        }
        .status-label {
            color: #666;
            font-weight: 500;
        }
        .status-value {
            color: #28a745;
            font-weight: 600;
        }
        .btn {
            display: inline-block;
            padding: 0.8rem 2rem;
            background: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            transition: background 0.3s;
            margin: 0 0.5rem;
        }
        .btn:hover {
            background: #0056b3;
        }
        .btn-danger {
            background: #dc3545;
        }
        .btn-danger:hover {
            background: #c82333;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">
            <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
        </div>
        <h1>Welcome!</h1>
        <p>You are successfully connected to the application and database.</p>

        <div class="status" id="status">
            <div class="status-item">
                <span class="status-label">Database</span>
                <span class="status-value">Checking...</span>
            </div>
            <div class="status-item">
                <span class="status-label">Server Time</span>
                <span class="status-value" id="serverTime">--</span>
            </div>
        </div>

        <a href="/" class="btn">Back to Login</a>
        <a href="#" onclick="logout()" class="btn btn-danger">Logout</a>
    </div>

    <script>
        async function checkStatus() {
            try {
                const response = await fetch('/api/status');
                const data = await response.json();
                const statusEl = document.querySelector('.status-value');
                const timeEl = document.getElementById('serverTime');

                if (data.status === 'connected') {
                    statusEl.textContent = data.db;
                    statusEl.style.color = '#28a745';
                    timeEl.textContent = new Date(data.db_time).toLocaleString();
                } else {
                    statusEl.textContent = 'Disconnected';
                    statusEl.style.color = '#dc3545';
                }
            } catch (err) {
                document.querySelector('.status-value').textContent = 'Error';
                document.querySelector('.status-value').style.color = '#dc3545';
            }
        }

        function logout() {
            localStorage.removeItem('token');
            window.location.href = '/';
        }

        checkStatus();
    </script>
</body>
</html>
